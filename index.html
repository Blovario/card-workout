<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0b5d36" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Card Workout" />
  <title>Card Workout</title>

  <style>
    :root {
      --bg: #074b2c;
      --panel: rgba(255,255,255,.10);
      --text: #fff;
      --muted: rgba(255,255,255,.72);
      --accent: #ffd84d;
      --danger: #df3048;
      --card-text: #111;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at top, rgba(255,255,255,.08), transparent 40%),
        linear-gradient(180deg, #0b6d40, var(--bg));
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100dvh;
      padding:
        calc(16px + env(safe-area-inset-top))
        16px
        calc(20px + env(safe-area-inset-bottom));
      display: flex;
      justify-content: center;
    }

    main {
      width: min(100%, 520px);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 8vw, 38px);
      line-height: 1;
      letter-spacing: -.04em;
    }

    .subtitle {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .counter {
      flex: 0 0 auto;
      padding: 10px 13px;
      border-radius: 14px;
      background: var(--panel);
      backdrop-filter: blur(10px);
      text-align: center;
    }

    .counter strong {
      display: block;
      font-size: 23px;
      line-height: 1;
    }

    .counter span {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .legend {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .legend-item {
      padding: 10px 12px;
      border-radius: 13px;
      background: var(--panel);
      font-size: 14px;
      font-weight: 700;
    }

    .red { color: var(--danger); }

    .playing-card {
      position: relative;
      width: min(72vw, 285px);
      aspect-ratio: 5 / 7;
      margin: 4px auto;
      padding: 20px;
      border-radius: 24px;
      background: #fff;
      color: var(--card-text);
      box-shadow: 0 22px 50px rgba(0,0,0,.28);
      display: grid;
      place-items: center;
      overflow: hidden;
      transform-origin: center;
    }

    .playing-card.animate {
      animation: draw .34s ease-out;
    }

    @keyframes draw {
      0% { transform: translateY(18px) scale(.88) rotate(-2deg); opacity: .25; }
      100% { transform: translateY(0) scale(1) rotate(0); opacity: 1; }
    }

    .corner {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-weight: 900;
      font-size: 27px;
      line-height: .9;
    }

    .corner.top { top: 16px; left: 16px; }
    .corner.bottom { right: 16px; bottom: 16px; transform: rotate(180deg); }

    .center {
      text-align: center;
    }

    .suit {
      font-size: clamp(78px, 26vw, 120px);
      line-height: .85;
    }

    .reps {
      margin-top: 16px;
      font-size: clamp(48px, 16vw, 76px);
      line-height: .9;
      font-weight: 950;
      letter-spacing: -.06em;
    }

    .exercise {
      margin-top: 8px;
      font-size: clamp(19px, 6vw, 28px);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .placeholder {
      color: #777;
      font-size: 20px;
      font-weight: 750;
      text-align: center;
      line-height: 1.35;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 17px;
      min-height: 58px;
      padding: 0 20px;
      font: inherit;
      font-size: 18px;
      font-weight: 850;
      cursor: pointer;
      touch-action: manipulation;
    }

    #drawButton {
      background: var(--accent);
      color: #171300;
      box-shadow: 0 9px 24px rgba(0,0,0,.18);
    }

    #resetButton {
      width: 62px;
      background: var(--panel);
      color: #fff;
      font-size: 24px;
    }

    button:disabled {
      opacity: .45;
      cursor: default;
    }

    details {
      border-radius: 15px;
      background: var(--panel);
      overflow: hidden;
    }

    summary {
      padding: 14px 16px;
      font-weight: 800;
      cursor: pointer;
    }

    ol {
      max-height: 190px;
      overflow-y: auto;
      margin: 0;
      padding: 0 18px 16px 43px;
      color: var(--muted);
    }

    li { padding: 5px 0; }

    .note {
      margin: 0;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main>
    <header>
      <div>
        <h1>Card Workout</h1>
        <p class="subtitle">Une carte = un exercice</p>
      </div>
      <div class="counter">
        <strong id="remaining">52</strong>
        <span>restantes</span>
      </div>
    </header>

    <section class="legend" aria-label="Correspondance des couleurs">
      <div class="legend-item"><span class="red">♥</span> Burpees</div>
      <div class="legend-item"><span class="red">♦</span> Squats</div>
      <div class="legend-item">♣ Pompes</div>
      <div class="legend-item">♠ Abdos</div>
    </section>

    <section id="card" class="playing-card" aria-live="polite">
      <div class="placeholder">
        Appuie sur<br><strong>« Tirer une carte »</strong>
      </div>
    </section>

    <section class="actions">
      <button id="drawButton" type="button">Tirer une carte</button>
      <button id="resetButton" type="button" aria-label="Recommencer">↻</button>
    </section>

    <details>
      <summary>Historique des tirages</summary>
      <ol id="history"></ol>
    </details>

    <p class="note">As = 14 · Valet = 11 · Dame = 12 · Roi = 13</p>
  </main>

  <script>
    const suits = [
      { suitName: "Cœur", symbol: "♥", color: "red", exercise: "Burpees" },
      { suitName: "Carreau", symbol: "♦", color: "red", exercise: "Squats" },
      { suitName: "Trèfle", symbol: "♣", color: "black", exercise: "Pompes" },
      { suitName: "Pique", symbol: "♠", color: "black", exercise: "Abdos" }
    ];

    const values = [
      { name: "As", label: "A", reps: 14 },
      { name: "2", label: "2", reps: 2 },
      { name: "3", label: "3", reps: 3 },
      { name: "4", label: "4", reps: 4 },
      { name: "5", label: "5", reps: 5 },
      { name: "6", label: "6", reps: 6 },
      { name: "7", label: "7", reps: 7 },
      { name: "8", label: "8", reps: 8 },
      { name: "9", label: "9", reps: 9 },
      { name: "10", label: "10", reps: 10 },
      { name: "Valet", label: "V", reps: 11 },
      { name: "Dame", label: "D", reps: 12 },
      { name: "Roi", label: "R", reps: 13 }
    ];

    const cardEl = document.getElementById("card");
    const remainingEl = document.getElementById("remaining");
    const historyEl = document.getElementById("history");
    const drawButton = document.getElementById("drawButton");
    const resetButton = document.getElementById("resetButton");

    let deck = [];

    function buildDeck() {
      return suits.flatMap(suit =>
        values.map(value => ({ ...suit, ...value }))
      );
    }

    function shuffle(cards) {
      for (let i = cards.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cards[i], cards[j]] = [cards[j], cards[i]];
      }
      return cards;
    }

    function vibrate() {
      if ("vibrate" in navigator) navigator.vibrate(35);
    }

    function renderCard(card) {
      const redClass = card.color === "red" ? "red" : "";

      cardEl.classList.remove("animate");
      void cardEl.offsetWidth;
      cardEl.classList.add("animate");

      cardEl.innerHTML = `
        <div class="corner top ${redClass}">
          <span>${card.label}</span>
          <span>${card.symbol}</span>
        </div>

        <div class="center ${redClass}">
          <div class="suit">${card.symbol}</div>
          <div class="reps">${card.reps}</div>
          <div class="exercise">${card.exercise}</div>
        </div>

        <div class="corner bottom ${redClass}">
          <span>${card.label}</span>
          <span>${card.symbol}</span>
        </div>
      `;
    }

    function drawCard() {
      if (deck.length === 0) return;

      const card = deck.pop();
      renderCard(card);
      vibrate();

      const item = document.createElement("li");
      item.textContent = `${card.name} de ${card.suitName} — ${card.reps} ${card.exercise.toLowerCase()}`;
      historyEl.prepend(item);

      remainingEl.textContent = deck.length;

      if (deck.length === 0) {
        drawButton.disabled = true;
        drawButton.textContent = "Paquet terminé";
      }
    }

    function reset() {
      deck = shuffle(buildDeck());
      remainingEl.textContent = deck.length;
      historyEl.innerHTML = "";
      drawButton.disabled = false;
      drawButton.textContent = "Tirer une carte";
      cardEl.className = "playing-card";
      cardEl.innerHTML = `
        <div class="placeholder">
          Appuie sur<br><strong>« Tirer une carte »</strong>
        </div>
      `;
    }

    drawButton.addEventListener("click", drawCard);
    resetButton.addEventListener("click", reset);

    reset();
  </script>
</body>
</html>
